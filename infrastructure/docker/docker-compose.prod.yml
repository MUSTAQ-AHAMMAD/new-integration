version: '3.9'

services:
  # ─────────────────────────────────────────
  # PostgreSQL
  # ─────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: integration_postgres_prod
    restart: always
    command: >
      postgres
        -c max_connections=300
        -c shared_preload_libraries=pg_stat_statements
        -c pg_stat_statements.track=all
    environment:
      POSTGRES_USER: integration
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: integration_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U integration -d integration_db']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - integration_net
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G

  # ─────────────────────────────────────────
  # PgBouncer — connection pooler
  # ─────────────────────────────────────────
  pgbouncer:
    image: edoburu/pgbouncer:1.22.0
    container_name: integration_pgbouncer_prod
    restart: always
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: integration
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: integration_db
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 500
      DEFAULT_POOL_SIZE: 50
      MIN_POOL_SIZE: 10
      AUTH_TYPE: plain
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - integration_net

  # ─────────────────────────────────────────
  # Redis — master node
  # ─────────────────────────────────────────
  redis-master:
    image: redis:7-alpine
    container_name: integration_redis_master_prod
    restart: always
    command: >
      redis-server
        --requirepass ${REDIS_PASSWORD}
        --maxmemory 1gb
        --maxmemory-policy allkeys-lru
        --save 900 1
        --save 300 10
    volumes:
      - redis_master_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - integration_net

  # ─────────────────────────────────────────
  # Redis — replica node
  # ─────────────────────────────────────────
  redis-replica:
    image: redis:7-alpine
    container_name: integration_redis_replica_prod
    restart: always
    command: >
      redis-server
        --requirepass ${REDIS_PASSWORD}
        --replicaof redis-master 6379
        --masterauth ${REDIS_PASSWORD}
        --maxmemory 512mb
        --maxmemory-policy allkeys-lru
    depends_on:
      redis-master:
        condition: service_healthy
    networks:
      - integration_net

  # ─────────────────────────────────────────
  # Redis Sentinels (3-node quorum)
  # ─────────────────────────────────────────
  redis-sentinel-1:
    image: redis:7-alpine
    container_name: integration_redis_sentinel_1_prod
    restart: always
    entrypoint:
      - sh
      - -c
      - |
        printf "sentinel monitor mymaster redis-master 6379 2\n\
        sentinel auth-pass mymaster ${REDIS_PASSWORD}\n\
        sentinel down-after-milliseconds mymaster 5000\n\
        sentinel failover-timeout mymaster 60000\n\
        sentinel parallel-syncs mymaster 1\n" > /tmp/sentinel.conf
        exec redis-sentinel /tmp/sentinel.conf
    depends_on:
      - redis-master
      - redis-replica
    networks:
      - integration_net

  redis-sentinel-2:
    image: redis:7-alpine
    container_name: integration_redis_sentinel_2_prod
    restart: always
    entrypoint:
      - sh
      - -c
      - |
        printf "sentinel monitor mymaster redis-master 6379 2\n\
        sentinel auth-pass mymaster ${REDIS_PASSWORD}\n\
        sentinel down-after-milliseconds mymaster 5000\n\
        sentinel failover-timeout mymaster 60000\n\
        sentinel parallel-syncs mymaster 1\n" > /tmp/sentinel.conf
        exec redis-sentinel /tmp/sentinel.conf
    depends_on:
      - redis-master
      - redis-replica
    networks:
      - integration_net

  redis-sentinel-3:
    image: redis:7-alpine
    container_name: integration_redis_sentinel_3_prod
    restart: always
    entrypoint:
      - sh
      - -c
      - |
        printf "sentinel monitor mymaster redis-master 6379 2\n\
        sentinel auth-pass mymaster ${REDIS_PASSWORD}\n\
        sentinel down-after-milliseconds mymaster 5000\n\
        sentinel failover-timeout mymaster 60000\n\
        sentinel parallel-syncs mymaster 1\n" > /tmp/sentinel.conf
        exec redis-sentinel /tmp/sentinel.conf
    depends_on:
      - redis-master
      - redis-replica
    networks:
      - integration_net

  # ─────────────────────────────────────────
  # Backend (NestJS) - production API server
  # ─────────────────────────────────────────
  backend:
    build:
      context: ../../packages/backend
      dockerfile: Dockerfile
      target: production
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://integration:${POSTGRES_PASSWORD}@pgbouncer:5432/integration_db?pgbouncer=true&connection_limit=10
      DIRECT_DATABASE_URL: postgresql://integration:${POSTGRES_PASSWORD}@postgres:5432/integration_db
      REDIS_SENTINEL_HOSTS: redis-sentinel-1:26379,redis-sentinel-2:26379,redis-sentinel-3:26379
      REDIS_MASTER_NAME: mymaster
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      LOG_LEVEL: info
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
      ODOO_BASE_URL: ${ODOO_BASE_URL}
      ODOO_DB: ${ODOO_DB}
      ODOO_USERNAME: ${ODOO_USERNAME}
      ODOO_PASSWORD: ${ODOO_PASSWORD}
      ORACLE_REST_BASE_URL: ${ORACLE_REST_BASE_URL}
      ORACLE_USERNAME: ${ORACLE_USERNAME}
      ORACLE_PASSWORD: ${ORACLE_PASSWORD}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://integration.example.com}
    ports:
      - '3001:3001'
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_started
      redis-master:
        condition: service_healthy
    networks:
      - integration_net
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:3001/api/v1/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
      replicas: 3

  # ─────────────────────────────────────────
  # Worker — dedicated BullMQ processor
  # Scale replicas independently of the API server
  # ─────────────────────────────────────────
  worker:
    build:
      context: ../../packages/backend
      dockerfile: Dockerfile
      target: production
    command: node dist/worker
    restart: always
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://integration:${POSTGRES_PASSWORD}@pgbouncer:5432/integration_db?pgbouncer=true&connection_limit=5
      DIRECT_DATABASE_URL: postgresql://integration:${POSTGRES_PASSWORD}@postgres:5432/integration_db
      REDIS_SENTINEL_HOSTS: redis-sentinel-1:26379,redis-sentinel-2:26379,redis-sentinel-3:26379
      REDIS_MASTER_NAME: mymaster
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      LOG_LEVEL: info
      ODOO_BASE_URL: ${ODOO_BASE_URL}
      ODOO_DB: ${ODOO_DB}
      ODOO_USERNAME: ${ODOO_USERNAME}
      ODOO_PASSWORD: ${ODOO_PASSWORD}
      ORACLE_REST_BASE_URL: ${ORACLE_REST_BASE_URL}
      ORACLE_USERNAME: ${ORACLE_USERNAME}
      ORACLE_PASSWORD: ${ORACLE_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_started
      redis-master:
        condition: service_healthy
    networks:
      - integration_net
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
      replicas: 2

  # ─────────────────────────────────────────
  # Dashboard (Next.js) - production
  # ─────────────────────────────────────────
  dashboard:
    build:
      context: ../../packages/dashboard
      dockerfile: Dockerfile
      target: production
    container_name: integration_dashboard_prod
    restart: always
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://backend:3001/api/v1}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-http://backend:3001}
    ports:
      - '3000:3000'
    depends_on:
      - backend
    networks:
      - integration_net
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:3000 || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3

  # ─────────────────────────────────────────
  # Nginx reverse proxy
  # ─────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: integration_nginx
    restart: always
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx_certs:/etc/ssl/certs
    depends_on:
      - backend
      - dashboard
    networks:
      - integration_net

volumes:
  postgres_data:
  redis_master_data:
  nginx_certs:

networks:
  integration_net:
    driver: bridge
