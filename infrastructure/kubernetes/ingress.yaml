---
# ─── Ingress ────────────────────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: integration-ingress
  namespace: integration
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - integration.example.com
        - api.integration.example.com
      secretName: integration-tls
  rules:
    - host: integration.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: integration-dashboard-service
                port:
                  number: 3000
    - host: api.integration.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: integration-backend-service
                port:
                  number: 3001
