services:
  # ─────────────────────────────────────────
  # PostgreSQL
  # ─────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: integration_postgres
    restart: unless-stopped
    command: >
      postgres
        -c max_connections=200
        -c shared_preload_libraries=pg_stat_statements
        -c pg_stat_statements.track=all
    environment:
      POSTGRES_USER: integration
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-integration_pass}
      POSTGRES_DB: integration_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U integration -d integration_db']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - integration_net

  # ─────────────────────────────────────────
  # PgBouncer — connection pooler (OPTIONAL in development)
  # By default, services connect directly to postgres:5432.
  # To enable PgBouncer, uncomment the pgbouncer dependency in backend/worker/seeder
  # and change DATABASE_URL to use @pgbouncer:5432
  # ─────────────────────────────────────────
  pgbouncer:
    image: edoburu/pgbouncer:v1.25.2-p0
    container_name: integration_pgbouncer
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: integration
      DB_PASSWORD: ${POSTGRES_PASSWORD:-integration_pass}
      DB_NAME: integration_db
      POOL_MODE: session
      MAX_CLIENT_CONN: 300
      DEFAULT_POOL_SIZE: 25
      MIN_POOL_SIZE: 5
      AUTH_TYPE: plain
    ports:
      - '5433:5432'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - integration_net
    profiles:
      - pgbouncer

  # ─────────────────────────────────────────
  # Redis — master node
  # ─────────────────────────────────────────
  redis-master:
    image: redis:7-alpine
    container_name: integration_redis_master
    restart: unless-stopped
    command: >
      redis-server
        --requirepass ${REDIS_PASSWORD:-redis_pass}
        --maxmemory 1gb
        --maxmemory-policy allkeys-lru
        --save 900 1
        --save 300 10
    ports:
      - '6379:6379'
    volumes:
      - redis_master_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD:-redis_pass}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - integration_net

  # ─────────────────────────────────────────
  # Redis — replica node
  # ─────────────────────────────────────────
  redis-replica:
    image: redis:7-alpine
    container_name: integration_redis_replica
    restart: unless-stopped
    command: >
      redis-server
        --requirepass ${REDIS_PASSWORD:-redis_pass}
        --replicaof redis-master 6379
        --masterauth ${REDIS_PASSWORD:-redis_pass}
        --maxmemory 512mb
        --maxmemory-policy allkeys-lru
    depends_on:
      redis-master:
        condition: service_healthy
    networks:
      - integration_net

  # ─────────────────────────────────────────
  # Redis Sentinels (3-node quorum)
  # ─────────────────────────────────────────
  redis-sentinel-1:
    image: redis:7-alpine
    container_name: integration_redis_sentinel_1
    restart: unless-stopped
    entrypoint:
      - sh
      - -c
      - |
        printf "sentinel resolve-hostnames yes\n\
        sentinel announce-hostnames yes\n\
        sentinel monitor mymaster redis-master 6379 2\n\
        sentinel auth-pass mymaster ${REDIS_PASSWORD:-redis_pass}\n\
        sentinel down-after-milliseconds mymaster 5000\n\
        sentinel failover-timeout mymaster 60000\n\
        sentinel parallel-syncs mymaster 1\n" > /tmp/sentinel.conf
        exec redis-sentinel /tmp/sentinel.conf
    ports:
      - '26379:26379'
    depends_on:
      - redis-master
      - redis-replica
    networks:
      - integration_net

  redis-sentinel-2:
    image: redis:7-alpine
    container_name: integration_redis_sentinel_2
    restart: unless-stopped
    entrypoint:
      - sh
      - -c
      - |
        printf "sentinel resolve-hostnames yes\n\
        sentinel announce-hostnames yes\n\
        sentinel monitor mymaster redis-master 6379 2\n\
        sentinel auth-pass mymaster ${REDIS_PASSWORD:-redis_pass}\n\
        sentinel down-after-milliseconds mymaster 5000\n\
        sentinel failover-timeout mymaster 60000\n\
        sentinel parallel-syncs mymaster 1\n" > /tmp/sentinel.conf
        exec redis-sentinel /tmp/sentinel.conf
    ports:
      - '26380:26379'
    depends_on:
      - redis-master
      - redis-replica
    networks:
      - integration_net

  redis-sentinel-3:
    image: redis:7-alpine
    container_name: integration_redis_sentinel_3
    restart: unless-stopped
    entrypoint:
      - sh
      - -c
      - |
        printf "sentinel resolve-hostnames yes\n\
        sentinel announce-hostnames yes\n\
        sentinel monitor mymaster redis-master 6379 2\n\
        sentinel auth-pass mymaster ${REDIS_PASSWORD:-redis_pass}\n\
        sentinel down-after-milliseconds mymaster 5000\n\
        sentinel failover-timeout mymaster 60000\n\
        sentinel parallel-syncs mymaster 1\n" > /tmp/sentinel.conf
        exec redis-sentinel /tmp/sentinel.conf
    ports:
      - '26381:26379'
    depends_on:
      - redis-master
      - redis-replica
    networks:
      - integration_net

  # ─────────────────────────────────────────
  # Backend (NestJS) — API server
  # ─────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
      target: development
    container_name: integration_backend
    restart: unless-stopped
    # Run compiled output WITHOUT nest --watch. Integration runs execute as
    # in-memory tasks; under `pnpm dev` any file change in the watched tree
    # (e.g. an ad-hoc `*.tmp.js` written into the container) hot-reloads the
    # process and silently kills an in-flight run, stranding its job at
    # PROCESSING. Build once at startup, then run node dist/main so nothing
    # restarts the API mid-run.
    command: ['sh', '-c', 'pnpm run build && node --enable-source-maps dist/main']
    environment:
      NODE_ENV: development
      PORT: 3001
      # Run the process in UTC so every Date/toISOString is deterministic
      # regardless of host timezone. The admin date-range → UTC conversion is
      # applied explicitly using APP_INTEGRATION_TIMEZONE (see below).
      TZ: UTC
      # Timezone the admin's date-range picker input is interpreted in before
      # converting to UTC for the Odoo/IBQ API. Default Asia/Riyadh (UTC+3).
      APP_INTEGRATION_TIMEZONE: ${APP_INTEGRATION_TIMEZONE:-Asia/Riyadh}
      # node-oracledb thick mode runs DB calls on libuv's thread pool; its
      # default size (4) caps concurrent Oracle ops regardless of pool size.
      # Match it to the DB pool so parallel order upserts truly run in parallel.
      UV_THREADPOOL_SIZE: "16"
      APP_DB_POOL_MIN: "16"
      APP_DB_POOL_MAX: "16"
      ODOO_INGEST_CONCURRENCY: "12"
      # Direct PostgreSQL connection (bypassing PgBouncer for development)
      DATABASE_URL: postgresql://integration:${POSTGRES_PASSWORD:-integration_pass}@postgres:5432/integration_db
      DIRECT_DATABASE_URL: postgresql://integration:${POSTGRES_PASSWORD:-integration_pass}@postgres:5432/integration_db
      REDIS_HOST: redis-master
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_pass}
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-in-production}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      LOG_LEVEL: debug
      # The dashboard derives its own host at runtime, so clients may connect
      # from any LAN address. Default to '*' (reflect the request origin) so no
      # rebuild is needed when IPs/hostnames change. Set an explicit
      # comma-separated allow-list in the root .env to lock this down for prod.
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      # Oracle DB — fill in your instance details in .env (copy from .env.example)
      # These are required when using the "Import from Oracle" button in the dashboard
            # Oracle DB — fill in your instance details in .env (copy from .env.example)
      # These are required when using the "Import from Oracle" button in the dashboard
      ORACLE_DB_HOST: ${ORACLE_DB_HOST:-}
      ORACLE_DB_PORT: ${ORACLE_DB_PORT:-1521}
      ORACLE_DB_SERVICE: ${ORACLE_DB_SERVICE:-}
      ORACLE_DB_SCHEMA: ${ORACLE_DB_SCHEMA:-ODOO_INTEGRATION}
      ORACLE_DB_USERNAME: ${ORACLE_DB_USERNAME:-}
      ORACLE_DB_PASSWORD: ${ORACLE_DB_PASSWORD:-}
      ORACLE_DB_ROLE: ${ORACLE_DB_ROLE:-}
      ORACLE_DB_THICK_MODE: ${ORACLE_DB_THICK_MODE:-false}
      ORACLE_DB_INSTANT_CLIENT_DIR: ${ORACLE_DB_INSTANT_CLIENT_DIR:-}
      # App DB (TypeORM/Oracle) — other APP_DB_* values come from the
      # packages/backend/.env inside the image (dotenv), but the Instant Client
      # path there is a Windows host path. Env vars set here win over dotenv,
      # so pin the Linux path bundled in the image.
      APP_DB_INSTANT_CLIENT_DIR: /opt/instantclient
      # Max concurrent SOAP invoice POSTs to Oracle Fusion. Kept LOW because
      # Oracle's AR tax engine intermittently throws transient faults
      # (CalculatedUnitSellingPrice NPE / "Failed to validate all rows") when
      # many invoices compute tax simultaneously — which then trips the
      # oracle:createSimpleInvoice circuit and blocks otherwise-healthy invoices.
      # Lower = fewer transient faults; raise cautiously if runs are too slow.
      ORACLE_SOAP_CONCURRENCY: ${ORACLE_SOAP_CONCURRENCY:-4}
    ports:
      - '3001:3001'
    depends_on:
      postgres:
        condition: service_healthy
      redis-master:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3001/api/v1/health || exit 1']
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 120s
    volumes:
      # Mount the local data/ folder read-only so CSV seed files are accessible
      # inside the container without rebuilding the image.
      - ./packages/backend/data:/app/packages/backend/data:ro
      # APP_DB_* live here (dotenv). .dockerignore excludes .env from the image,
      # so it must be bind-mounted in at runtime rather than baked in.
      - ./packages/backend/.env:/app/packages/backend/.env:ro
    networks:
      - integration_net

  # ─────────────────────────────────────────
  # CSV Seeder — one-shot on-demand import
  # Usage: docker compose run --rm seeder
  #        docker compose run --rm seeder data/vendhq-registers.csv
  #        docker compose run --rm seeder data/file.csv --table vendhq-registers
  # ─────────────────────────────────────────
  seeder:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
      target: development
    environment:
      # Direct PostgreSQL connection (bypassing PgBouncer for development)
      DATABASE_URL: postgresql://integration:${POSTGRES_PASSWORD:-integration_pass}@postgres:5432/integration_db
      DIRECT_DATABASE_URL: postgresql://integration:${POSTGRES_PASSWORD:-integration_pass}@postgres:5432/integration_db
    # Use ts-node directly — devDependencies are installed in the development image,
    # so no build step is required. seed-csv imports into the Oracle app DB (APP_DB_*).
    entrypoint:
      - sh
      - -c
      - >
        node_modules/.bin/ts-node -r tsconfig-paths/register src/scripts/seed-csv.ts "$@"
      - --
    volumes:
      - ./packages/backend/data:/app/packages/backend/data:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - integration_net
    profiles:
      - seeder
  worker:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
      target: development
    container_name: integration_worker
    restart: unless-stopped
    command: ['sh', '-c', 'pnpm run start:worker:dev']
    environment:
      NODE_ENV: development
      # Match the backend: run in UTC and interpret admin dates in this zone.
      TZ: UTC
      APP_INTEGRATION_TIMEZONE: ${APP_INTEGRATION_TIMEZONE:-Asia/Riyadh}
      # See backend: raise libuv thread pool so thick-mode Oracle ops parallelize.
      UV_THREADPOOL_SIZE: "16"
      APP_DB_POOL_MIN: "16"
      APP_DB_POOL_MAX: "16"
      ODOO_INGEST_CONCURRENCY: "12"
      # Direct PostgreSQL connection (bypassing PgBouncer for development)
      DATABASE_URL: postgresql://integration:${POSTGRES_PASSWORD:-integration_pass}@postgres:5432/integration_db
      DIRECT_DATABASE_URL: postgresql://integration:${POSTGRES_PASSWORD:-integration_pass}@postgres:5432/integration_db
      REDIS_HOST: redis-master
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_pass}
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-in-production}
      LOG_LEVEL: debug
      # See backend service: override the Windows Instant Client path from the
      # baked-in packages/backend/.env with the Linux path bundled in the image.
      APP_DB_INSTANT_CLIENT_DIR: /opt/instantclient
      ORACLE_DB_THICK_MODE: ${ORACLE_DB_THICK_MODE:-false}
      ORACLE_DB_INSTANT_CLIENT_DIR: ${ORACLE_DB_INSTANT_CLIENT_DIR:-}
      # See backend: cap concurrent SOAP invoice POSTs low so Oracle's AR tax
      # engine doesn't throw transient faults under parallel tax computation
      # (which trips the oracle:createSimpleInvoice circuit). Overridable via .env.
      ORACLE_SOAP_CONCURRENCY: ${ORACLE_SOAP_CONCURRENCY:-4}
    volumes:
      # APP_DB_* live here (dotenv). .dockerignore excludes .env from the image,
      # so it must be bind-mounted in at runtime rather than baked in.
      - ./packages/backend/.env:/app/packages/backend/.env:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis-master:
        condition: service_healthy
    networks:
      - integration_net

  # ─────────────────────────────────────────
  # Dashboard (Next.js)
  # ─────────────────────────────────────────
  dashboard:
    build:
      context: .
      dockerfile: packages/dashboard/Dockerfile
      target: development
    container_name: integration_dashboard
    restart: unless-stopped
    environment:
      # NEXT_PUBLIC_API_URL / NEXT_PUBLIC_WS_URL are intentionally left UNSET.
      # The browser derives the backend host from window.location at runtime
      # (see packages/dashboard/src/lib/runtime-config.ts), so the dashboard
      # works from localhost, the server's LAN IP, or a hostname with no
      # rebuild. Set NEXT_PUBLIC_API_URL only for a fixed prod/reverse-proxy URL.
      #
      # Server-side rewrite fallback target (inside the container network):
      INTERNAL_API_URL: http://backend:3001/api/v1
    ports:
      - '3000:3000'
    depends_on:
      - backend
    networks:
      - integration_net

  # ─────────────────────────────────────────
  # Prometheus
  # ─────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: integration_prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    ports:
      - '9090:9090'
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - integration_net

  # ─────────────────────────────────────────
  # Grafana
  # ─────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.2
    container_name: integration_grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_INSTALL_PLUGINS: grafana-clock-panel
    ports:
      - '3003:3000'
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - integration_net

  # ─────────────────────────────────────────
  # Redis Exporter — Prometheus metrics for Redis
  # ─────────────────────────────────────────
  redis-exporter:
    image: oliver006/redis_exporter:v1.58.0
    container_name: integration_redis_exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://redis-master:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_pass}
    ports:
      - '9121:9121'
    depends_on:
      - redis-master
    networks:
      - integration_net

  # ─────────────────────────────────────────
  # Postgres Exporter — Prometheus metrics for PostgreSQL
  # ─────────────────────────────────────────
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: integration_postgres_exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: postgresql://integration:${POSTGRES_PASSWORD:-integration_pass}@postgres:5432/integration_db?sslmode=disable
    ports:
      - '9187:9187'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - integration_net

  # ─────────────────────────────────────────
  # Redis Commander (dev tool)
  # ─────────────────────────────────────────
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: integration_redis_commander
    restart: unless-stopped
    environment:
      REDIS_HOSTS: local:redis-master:6379:0:${REDIS_PASSWORD:-redis_pass}
    ports:
      - '8081:8081'
    depends_on:
      - redis-master
    networks:
      - integration_net
    profiles:
      - dev-tools

volumes:
  postgres_data:
  redis_master_data:
  prometheus_data:
  grafana_data:

networks:
  integration_net:
    driver: bridge
