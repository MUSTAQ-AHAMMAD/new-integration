services:
  # ... (keeping all services the same until backend section)
  # ─────────────────────────────────────────
  # Backend (NestJS) — API server
  # ─────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
      target: production
    container_name: integration_backend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://integration:${POSTGRES_PASSWORD:-integration_pass}@pgbouncer:5432/integration_db?pgbouncer=true&connection_limit=10
      DIRECT_DATABASE_URL: postgresql://integration:${POSTGRES_PASSWORD:-integration_pass}@postgres:5432/integration_db
      REDIS_SENTINEL_HOSTS: redis-sentinel-1:26379,redis-sentinel-2:26379,redis-sentinel-3:26379
      REDIS_MASTER_NAME: mymaster
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_pass}
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-in-production}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      LOG_LEVEL: debug
      CORS_ORIGIN: http://localhost:3000
      # Oracle Database Configuration
      ORACLE_DB_THICK_MODE: "true"
      ORACLE_DB_INSTANT_CLIENT_DIR: "/opt/instantclient"
      ORACLE_DB_HOST: ${ORACLE_DB_HOST:-193.122.68.27}
      ORACLE_DB_PORT: ${ORACLE_DB_PORT:-1521}
      ORACLE_DB_SERVICE: ${ORACLE_DB_SERVICE:-TestDB_jed1sw.dbsubnet.testvcn.oraclevcn.com}
      ORACLE_DB_USERNAME: ${ORACLE_DB_USERNAME:-SYS}
      ORACLE_DB_PASSWORD: ${ORACLE_DB_PASSWORD:-Tamer_innovate123}
      ORACLE_DB_ROLE: ${ORACLE_DB_ROLE:-SYSDBA}
      ORACLE_REST_BASE_URL: ${ORACLE_REST_BASE_URL:-https://oracle-instance/fscmRestApi/resources/11.13.18.05}
      ORACLE_USERNAME: ${ORACLE_USERNAME:-oracle_user}
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:-oracle_password}
      ORACLE_SOAP_BASE_URL: ${ORACLE_SOAP_BASE_URL:-https://oracle-instance}
      ORACLE_SOAP_WSDL_URL: ${ORACLE_SOAP_WSDL_URL:-https://oracle-instance/services/v2}
    ports:
      - '3001:3001'
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_started
      redis-master:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3001/api/v1/health || exit 1']
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 120s
    networks:
      - integration_net