services:
  # ─────────────────────────────────────────
  # PostgreSQL
  # ─────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: integration_postgres
    restart: unless-stopped
    command: >
      postgres
        -c max_connections=200
        -c shared_preload_libraries=pg_stat_statements
        -c pg_stat_statements.track=all
    environment:
      POSTGRES_USER: integration
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-integration_pass}
      POSTGRES_DB: integration_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U integration -d integration_db']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - integration_net

  # ─────────────────────────────────────────
  # PgBouncer — connection pooler
  # ─────────────────────────────────────────
  pgbouncer:
    image: edoburu/pgbouncer:v1.25.2-p0
    container_name: integration_pgbouncer
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: integration
      DB_PASSWORD: ${POSTGRES_PASSWORD:-integration_pass}
      DB_NAME: integration_db
      POOL_MODE: session
      MAX_CLIENT_CONN: 300
      DEFAULT_POOL_SIZE: 25
      MIN_POOL_SIZE: 5
      AUTH_TYPE: plain
    ports:
      - '5433:5432'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - integration_net

  # ─────────────────────────────────────────
  # Redis — master node
  # ─────────────────────────────────────────
  redis-master:
    image: redis:7-alpine
    container_name: integration_redis_master
    restart: unless-stopped
    command: >
      redis-server
        --requirepass ${REDIS_PASSWORD:-redis_pass}
        --maxmemory 1gb
        --maxmemory-policy allkeys-lru
        --save 900 1
        --save 300 10
    ports:
      - '6379:6379'
    volumes:
      - redis_master_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD:-redis_pass}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - integration_net

  # ─────────────────────────────────────────
  # Redis — replica node
  # ─────────────────────────────────────────
  redis-replica:
    image: redis:7-alpine
    container_name: integration_redis_replica
    restart: unless-stopped
    command: >
      redis-server
        --requirepass ${REDIS_PASSWORD:-redis_pass}
        --replicaof redis-master 6379
        --masterauth ${REDIS_PASSWORD:-redis_pass}
        --maxmemory 512mb
        --maxmemory-policy allkeys-lru
    depends_on:
      redis-master:
        condition: service_healthy
    networks:
      - integration_net

  # ─────────────────────────────────────────
  # Redis Sentinels (3-node quorum)
  # ─────────────────────────────────────────
  redis-sentinel-1:
    image: redis:7-alpine
    container_name: integration_redis_sentinel_1
    restart: unless-stopped
    entrypoint:
      - sh
      - -c
      - |
        printf "sentinel monitor mymaster redis-master 6379 2\n\
        sentinel auth-pass mymaster ${REDIS_PASSWORD:-redis_pass}\n\
        sentinel down-after-milliseconds mymaster 5000\n\
        sentinel failover-timeout mymaster 60000\n\
        sentinel parallel-syncs mymaster 1\n" > /tmp/sentinel.conf
        exec redis-sentinel /tmp/sentinel.conf
    ports:
      - '26379:26379'
    depends_on:
      - redis-master
      - redis-replica
    networks:
      - integration_net

  redis-sentinel-2:
    image: redis:7-alpine
    container_name: integration_redis_sentinel_2
    restart: unless-stopped
    entrypoint:
      - sh
      - -c
      - |
        printf "sentinel monitor mymaster redis-master 6379 2\n\
        sentinel auth-pass mymaster ${REDIS_PASSWORD:-redis_pass}\n\
        sentinel down-after-milliseconds mymaster 5000\n\
        sentinel failover-timeout mymaster 60000\n\
        sentinel parallel-syncs mymaster 1\n" > /tmp/sentinel.conf
        exec redis-sentinel /tmp/sentinel.conf
    ports:
      - '26380:26379'
    depends_on:
      - redis-master
      - redis-replica
    networks:
      - integration_net

  redis-sentinel-3:
    image: redis:7-alpine
    container_name: integration_redis_sentinel_3
    restart: unless-stopped
    entrypoint:
      - sh
      - -c
      - |
        printf "sentinel monitor mymaster redis-master 6379 2\n\
        sentinel auth-pass mymaster ${REDIS_PASSWORD:-redis_pass}\n\
        sentinel down-after-milliseconds mymaster 5000\n\
        sentinel failover-timeout mymaster 60000\n\
        sentinel parallel-syncs mymaster 1\n" > /tmp/sentinel.conf
        exec redis-sentinel /tmp/sentinel.conf
    ports:
      - '26381:26379'
    depends_on:
      - redis-master
      - redis-replica
    networks:
      - integration_net

  # ─────────────────────────────────────────
  # Backend (NestJS) — API server
  # ─────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
      target: development
    container_name: integration_backend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://integration:${POSTGRES_PASSWORD:-integration_pass}@pgbouncer:5432/integration_db?pgbouncer=true&connection_limit=10
      DIRECT_DATABASE_URL: postgresql://integration:${POSTGRES_PASSWORD:-integration_pass}@postgres:5432/integration_db
      REDIS_HOST: redis-master
      
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_pass}
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-in-production}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      LOG_LEVEL: debug
      CORS_ORIGIN: http://localhost:3000
    ports:
      - '3001:3001'
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_started
      redis-master:
        condition: service_healthy
    networks:
      - integration_net

  # ─────────────────────────────────────────
  # Worker — dedicated BullMQ processor
  # ─────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
      target: development
    container_name: integration_worker
    restart: unless-stopped
    command: ['sh', '-c', 'sleep 365d']
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://integration:${POSTGRES_PASSWORD:-integration_pass}@pgbouncer:5432/integration_db?pgbouncer=true&connection_limit=5
      DIRECT_DATABASE_URL: postgresql://integration:${POSTGRES_PASSWORD:-integration_pass}@postgres:5432/integration_db
      REDIS_HOST: redis-master
      
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_pass}
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-in-production}
      LOG_LEVEL: debug
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_started
      redis-master:
        condition: service_healthy
    networks:
      - integration_net

  # ─────────────────────────────────────────
  # Dashboard (Next.js)
  # ─────────────────────────────────────────
  dashboard:
    build:
      context: .
      dockerfile: packages/dashboard/Dockerfile
      target: development
    container_name: integration_dashboard
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
      NEXT_PUBLIC_WS_URL: http://localhost:3001
    ports:
      - '3000:3000'
    depends_on:
      - backend
    networks:
      - integration_net

  # ─────────────────────────────────────────
  # Prometheus
  # ─────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: integration_prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    ports:
      - '9090:9090'
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - integration_net

  # ─────────────────────────────────────────
  # Grafana
  # ─────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.2
    container_name: integration_grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_INSTALL_PLUGINS: grafana-clock-panel
    ports:
      - '3003:3000'
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - integration_net

  # ─────────────────────────────────────────
  # Redis Exporter — Prometheus metrics for Redis
  # ─────────────────────────────────────────
  redis-exporter:
    image: oliver006/redis_exporter:v1.58.0
    container_name: integration_redis_exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://redis-master:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_pass}
    ports:
      - '9121:9121'
    depends_on:
      - redis-master
    networks:
      - integration_net

  # ─────────────────────────────────────────
  # Postgres Exporter — Prometheus metrics for PostgreSQL
  # ─────────────────────────────────────────
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: integration_postgres_exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: postgresql://integration:${POSTGRES_PASSWORD:-integration_pass}@postgres:5432/integration_db?sslmode=disable
    ports:
      - '9187:9187'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - integration_net

  # ─────────────────────────────────────────
  # Redis Commander (dev tool)
  # ─────────────────────────────────────────
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: integration_redis_commander
    restart: unless-stopped
    environment:
      REDIS_HOSTS: local:redis-master:6379:0:${REDIS_PASSWORD:-redis_pass}
    ports:
      - '8081:8081'
    depends_on:
      - redis-master
    networks:
      - integration_net
    profiles:
      - dev-tools

volumes:
  postgres_data:
  redis_master_data:
  prometheus_data:
  grafana_data:

networks:
  integration_net:
    driver: bridge
