version: '3.9'

services:
  # ─────────────────────────────────────────
  # PostgreSQL
  # ─────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: integration_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: integration
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: integration_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U integration -d integration_db']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - integration_net
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G

  # ─────────────────────────────────────────
  # Redis
  # ─────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: integration_redis_prod
    restart: always
    command: >
      redis-server
        --requirepass ${REDIS_PASSWORD}
        --maxmemory 256mb
        --maxmemory-policy allkeys-lru
        --save 900 1
        --save 300 10
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - integration_net

  # ─────────────────────────────────────────
  # Backend (NestJS) - production
  # ─────────────────────────────────────────
  backend:
    build:
      context: ../../packages/backend
      dockerfile: Dockerfile
      target: production
    container_name: integration_backend_prod
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://integration:${POSTGRES_PASSWORD}@postgres:5432/integration_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      LOG_LEVEL: info
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
      ODOO_BASE_URL: ${ODOO_BASE_URL}
      ODOO_DB: ${ODOO_DB}
      ODOO_USERNAME: ${ODOO_USERNAME}
      ODOO_PASSWORD: ${ODOO_PASSWORD}
      ORACLE_REST_BASE_URL: ${ORACLE_REST_BASE_URL}
      ORACLE_USERNAME: ${ORACLE_USERNAME}
      ORACLE_PASSWORD: ${ORACLE_PASSWORD}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://integration.example.com}
    ports:
      - '3001:3001'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - integration_net
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:3001/api/v1/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
      replicas: 2

  # ─────────────────────────────────────────
  # Dashboard (Next.js) - production
  # ─────────────────────────────────────────
  dashboard:
    build:
      context: ../../packages/dashboard
      dockerfile: Dockerfile
      target: production
    container_name: integration_dashboard_prod
    restart: always
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://backend:3001/api/v1}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-http://backend:3001}
    ports:
      - '3000:3000'
    depends_on:
      - backend
    networks:
      - integration_net
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:3000 || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3

  # ─────────────────────────────────────────
  # Nginx reverse proxy
  # ─────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: integration_nginx
    restart: always
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx_certs:/etc/ssl/certs
    depends_on:
      - backend
      - dashboard
    networks:
      - integration_net

volumes:
  postgres_data:
  redis_data:
  nginx_certs:

networks:
  integration_net:
    driver: bridge
